<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dariow • Démo chat</title>
  <style>
    :root { color-scheme: light; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#f7f7f8}
    .wrap{max-width:720px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .head{padding:12px 16px;border-bottom:1px solid #eee;font-weight:600;display:flex;justify-content:space-between;align-items:center}
    .chat{height:60vh;overflow:auto;padding:16px}
    .msg{margin:8px 0;display:flex}
    .me .bubble{margin-left:auto;background:#e6f0ff}
    .bot .bubble{margin-right:auto;background:#f1f5f9}
    .bubble{max-width:70%;padding:10px 12px;border-radius:12px;white-space:pre-wrap}
    .bar{display:flex;gap:8px;padding:12px;border-top:1px solid #eee;background:#fafafa}
    input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px}
    button{padding:10px 14px;border:0;border-radius:8px;background:#0ea5e9;color:#fff;font-weight:600;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    #reset{background:#ef4444}
    .typing{display:flex;gap:4px;align-items:center;opacity:0.7}
    .dot{width:6px;height:6px;background:#333;border-radius:50%;animation:blink 1s infinite}
    .dot:nth-child(2){animation-delay:0.2s}
    .dot:nth-child(3){animation-delay:0.4s}
    @keyframes blink{0%,80%,100%{opacity:0.3}40%{opacity:1}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        💬 Dariow — Démo chat
        <button id="reset">🔄 Nouvelle discussion</button>
      </div>
      <div id="chat" class="chat"></div>
      <div class="bar">
        <input id="inp" placeholder="Écrivez votre message…" autocomplete="off" />
        <button id="send">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    // 🔗 REMPLACE ICI par l’URL de ton webhook n8n (prod, pas /webhook-test/)
    const WEBHOOK_URL = "https://dariow.app.n8n.cloud/webhook/dariow-comm"

    const chat = document.getElementById("chat");
    const inp = document.getElementById("inp");
    const btn = document.getElementById("send");
    const resetBtn = document.getElementById("reset");

    // Session persistante pour la mémoire n8n
    let sessionId = localStorage.getItem("dariow-session");
    if (!sessionId) {
      sessionId = "web:" + Math.random().toString(36).slice(2);
      localStorage.setItem("dariow-session", sessionId);
    }

    // Affiche un message (bot/me)
    function addMsg(text, who="bot", id="") {
      const row = document.createElement("div");
      row.className = "msg " + who;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      if (id) bubble.id = id;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    // Affiche l’animation "…"
    function addTyping(id) {
      const row = document.createElement("div");
      row.className = "msg bot";
      const bubble = document.createElement("div");
      bubble.className = "bubble typing";
      if (id) bubble.id = id;
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        bubble.appendChild(dot);
      }
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeMsg(id) {
      const el = document.getElementById(id);
      if (el) el.parentNode.remove();
    }

    async function send() {
      const text = inp.value.trim();
      if (!text) return;
      addMsg(text, "me");
      inp.value = "";
      btn.disabled = true;

      const typingId = "typing-" + Date.now();
      addTyping(typingId);

      try {
        // Pas de JSON -> évite le preflight CORS
        const body = new URLSearchParams();
        body.append("text", text);
        body.append("sessionId", sessionId);

        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body
        });

        const reply = await res.text();
        removeMsg(typingId);
        addMsg(reply || "(aucune réponse)", "bot");
      } catch (e) {
        removeMsg(typingId);
        addMsg("⚠️ Erreur réseau : " + e.message, "bot");
      } finally {
        btn.disabled = false;
        inp.focus();
      }
    }

    // Reset session + vidé du chat
    resetBtn.addEventListener("click", () => {
      localStorage.removeItem("dariow-session");
      sessionId = "web:" + Math.random().toString(36).slice(2);
      localStorage.setItem("dariow-session", sessionId);
      chat.innerHTML = "";
      addMsg("Nouvelle discussion commencée 🆕", "bot");
    });

    btn.addEventListener("click", send);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    // Message d’accueil
    addMsg("Pour commencer la discussion, dîtes 'Salut'");
  </script>
</body>
</html>
